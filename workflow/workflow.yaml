# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
# The registered name and the config each target ships.

staging-settings:
  user-workflow:
    workflow-name: "refuel-staging"
    deployment-registry: "onchain:ethereum-mainnet"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "refuel-production"
    deployment-registry: "onchain:ethereum-mainnet"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
